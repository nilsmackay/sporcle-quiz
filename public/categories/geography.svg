<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3ED"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Globe -->
  <g transform="translate(200,175)">
    <circle cx="0" cy="0" r="85" fill="#D4E8F0" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Continents (simplified) -->
    <ellipse cx="-20" cy="-25" rx="30" ry="35" fill="#8DB580" stroke="#6B6560" stroke-width="1" transform="rotate(-10,-20,-25)"/>
    <ellipse cx="30" cy="-10" rx="25" ry="40" fill="#8DB580" stroke="#6B6560" stroke-width="1" transform="rotate(5,30,-10)"/>
    <ellipse cx="-10" cy="40" rx="20" ry="12" fill="#8DB580" stroke="#6B6560" stroke-width="1"/>
    <ellipse cx="45" cy="35" rx="15" ry="18" fill="#8DB580" stroke="#6B6560" stroke-width="1"/>
    <!-- Grid lines -->
    <ellipse cx="0" cy="0" rx="85" ry="40" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="40" ry="85" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.3"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#1A1A1A" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#1A1A1A" stroke-width="0.5" opacity="0.3"/>
    <!-- Globe stand -->
    <path d="M-50,75 Q-50,95 0,95 Q50,95 50,75" fill="none" stroke="#B8924A" stroke-width="3"/>
    <line x1="0" y1="85" x2="0" y2="110" stroke="#B8924A" stroke-width="3"/>
    <ellipse cx="0" cy="112" rx="30" ry="5" fill="#B8924A" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>
  <!-- Compass -->
  <g transform="translate(85,310)">
    <circle cx="0" cy="0" r="22" fill="white" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="0,-16 4,0 0,4 -4,0" fill="#C23B22"/>
    <polygon points="0,16 4,0 0,-4 -4,0" fill="#1A1A1A"/>
    <circle cx="0" cy="0" r="3" fill="#B8924A"/>
    <text x="0" y="-18" text-anchor="middle" font-family="serif" font-size="8" fill="#1A1A1A" font-weight="bold">N</text>
  </g>
  <!-- Mountains -->
  <g transform="translate(310,305)">
    <polygon points="-35,20 0,-25 35,20" fill="#6B6560" stroke="#1A1A1A" stroke-width="1.5"/>
    <polygon points="-5,-25 5,-15 15,-25" fill="white" opacity="0.6"/>
    <polygon points="-15,20 15,-10 45,20" fill="#8B8580" stroke="#1A1A1A" stroke-width="1.5"/>
    <polygon points="10,-10 18,-3 25,-10" fill="white" opacity="0.6"/>
  </g>
  <!-- Category label -->
  <text x="200" y="370" text-anchor="middle" font-family="'Fraunces', serif" font-weight="700" font-size="28" fill="#1A1A1A" letter-spacing="-0.5">Geography</text>
</svg>
