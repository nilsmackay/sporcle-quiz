<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3ED"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Film clapperboard -->
  <g transform="translate(200,130)">
    <!-- Board -->
    <rect x="-55" y="-15" width="110" height="70" rx="2" fill="white" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Top clapper -->
    <rect x="-55" y="-35" width="110" height="22" rx="2" fill="#1A1A1A"/>
    <line x1="-35" y1="-35" x2="-25" y2="-13" stroke="white" stroke-width="3"/>
    <line x1="-10" y1="-35" x2="0" y2="-13" stroke="white" stroke-width="3"/>
    <line x1="15" y1="-35" x2="25" y2="-13" stroke="white" stroke-width="3"/>
    <line x1="40" y1="-35" x2="50" y2="-13" stroke="white" stroke-width="3"/>
    <!-- Text on board -->
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6B6560">SCENE</text>
    <text x="0" y="35" text-anchor="middle" font-family="serif" font-size="14" fill="#1A1A1A" font-weight="bold">TAKE 1</text>
  </g>
  <!-- Oscar statuette -->
  <g transform="translate(95,270)">
    <ellipse cx="0" cy="30" rx="14" ry="5" fill="#B8924A" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="-5" y="15" width="10" height="15" rx="1" fill="#B8924A" stroke="#1A1A1A" stroke-width="1.5"/>
    <ellipse cx="0" cy="-5" rx="10" ry="20" fill="#B8924A" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="0" cy="-20" r="7" fill="#B8924A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Sword/detail -->
    <line x1="0" y1="-12" x2="0" y2="10" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="-7" y1="-5" x2="7" y2="-5" stroke="#1A1A1A" stroke-width="1"/>
  </g>
  <!-- Music note -->
  <g transform="translate(200,265)">
    <circle cx="-10" cy="20" r="10" fill="#C23B22"/>
    <circle cx="20" cy="15" r="10" fill="#C23B22"/>
    <line x1="0" y1="20" x2="0" y2="-25" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="30" y1="15" x2="30" y2="-30" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="0" y1="-25" x2="30" y2="-30" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="0" y1="-18" x2="30" y2="-23" stroke="#1A1A1A" stroke-width="3"/>
  </g>
  <!-- Cocktail glass -->
  <g transform="translate(310,270)">
    <polygon points="-25,-20 25,-20 0,15" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="-20,-20 20,-20 0,8" fill="#C23B22" opacity="0.3"/>
    <line x1="0" y1="15" x2="0" y2="30" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Olive -->
    <circle cx="8" cy="-12" r="4" fill="#8DB580" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="-5" y1="-20" x2="8" y2="-12" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>
  <!-- Category label -->
  <text x="200" y="370" text-anchor="middle" font-family="'Fraunces', serif" font-weight="700" font-size="28" fill="#1A1A1A" letter-spacing="-0.5">General</text>
</svg>
