<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3ED"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
    <linearGradient id="flask-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BC8A4"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Erlenmeyer flask -->
  <g transform="translate(200,160)">
    <!-- Flask body -->
    <path d="M-15,-70 L-15,-20 L-55,50 Q-60,60 -50,65 L50,65 Q60,60 55,50 L15,-20 L15,-70 Z" fill="white" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M-40,25 L-55,50 Q-60,60 -50,65 L50,65 Q60,60 55,50 L40,25 Z" fill="url(#flask-liquid)" opacity="0.6"/>
    <!-- Bubbles -->
    <circle cx="-10" cy="35" r="4" fill="white" opacity="0.5"/>
    <circle cx="15" cy="45" r="3" fill="white" opacity="0.5"/>
    <circle cx="5" cy="25" r="2" fill="white" opacity="0.5"/>
    <!-- Flask rim -->
    <rect x="-18" y="-75" width="36" height="6" rx="1" fill="white" stroke="#1A1A1A" stroke-width="2"/>
  </g>
  <!-- Atom -->
  <g transform="translate(95,290)">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#C23B22" stroke-width="2" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#C23B22" stroke-width="2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#C23B22" stroke-width="2" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="5" fill="#C23B22"/>
    <!-- Electrons -->
    <circle cx="28" cy="0" r="3" fill="#1A1A1A"/>
    <circle cx="-14" cy="-24" r="3" fill="#1A1A1A"/>
    <circle cx="-14" cy="24" r="3" fill="#1A1A1A"/>
  </g>
  <!-- Book -->
  <g transform="translate(305,280)">
    <!-- Book body -->
    <rect x="-25" y="-20" width="50" height="35" rx="2" fill="#B8924A" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Spine -->
    <line x1="-25" y1="-20" x2="-25" y2="15" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Pages -->
    <rect x="-22" y="-17" width="44" height="29" rx="1" fill="#F7F3ED"/>
    <!-- Text lines -->
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#D4CFC7" stroke-width="2"/>
    <line x1="-15" y1="-3" x2="10" y2="-3" stroke="#D4CFC7" stroke-width="2"/>
    <line x1="-15" y1="4" x2="13" y2="4" stroke="#D4CFC7" stroke-width="2"/>
    <!-- Star on cover -->
    <text x="0" y="2" text-anchor="middle" font-family="serif" font-size="16" fill="#B8924A">★</text>
  </g>
  <!-- Category label -->
  <text x="200" y="370" text-anchor="middle" font-family="'Fraunces', serif" font-weight="700" font-size="28" fill="#1A1A1A" letter-spacing="-0.5">Nerd</text>
</svg>
