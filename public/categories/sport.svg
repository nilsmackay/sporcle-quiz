<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3ED"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Trophy -->
  <g transform="translate(200,160)">
    <!-- Cup body -->
    <path d="M-45,-60 L-55,-60 Q-70,-60 -70,-40 L-60,0 Q-50,15 0,20 Q50,15 60,0 L70,-40 Q70,-60 55,-60 L45,-60 L40,-80 Q30,-90 0,-90 Q-30,-90 -40,-80 Z" fill="#B8924A" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Cup shine -->
    <path d="M-30,-70 Q-20,-80 0,-80 L0,-60 Q-15,-60 -25,-50 Z" fill="#D4B06A" opacity="0.5"/>
    <!-- Handles -->
    <path d="M-55,-50 Q-85,-45 -85,-20 Q-85,5 -60,5" fill="none" stroke="#B8924A" stroke-width="6"/>
    <path d="M-55,-50 Q-85,-45 -85,-20 Q-85,5 -60,5" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M55,-50 Q85,-45 85,-20 Q85,5 60,5" fill="none" stroke="#B8924A" stroke-width="6"/>
    <path d="M55,-50 Q85,-45 85,-20 Q85,5 60,5" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Star on cup -->
    <polygon points="0,-35 8,-15 30,-15 13,-1 19,20 0,10 -19,20 -13,-1 -30,-15 -8,-15" fill="#F7F3ED" opacity="0.6"/>
    <!-- Base -->
    <rect x="-15" y="20" width="30" height="15" rx="2" fill="#B8924A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="-35" y="35" width="70" height="10" rx="2" fill="#B8924A" stroke="#1A1A1A" stroke-width="2"/>
  </g>
  <!-- Soccer ball -->
  <g transform="translate(105,280)">
    <circle cx="0" cy="0" r="28" fill="white" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#1A1A1A"/>
    <line x1="0" y1="-12" x2="0" y2="-27" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="11" y1="-4" x2="24" y2="-14" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="7" y1="10" x2="18" y2="22" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="-7" y1="10" x2="-18" y2="22" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="-11" y1="-4" x2="-24" y2="-14" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>
  <!-- Medal -->
  <g transform="translate(295,270)">
    <line x1="0" y1="-40" x2="-12" y2="-15" stroke="#C23B22" stroke-width="8"/>
    <line x1="0" y1="-40" x2="12" y2="-15" stroke="#C23B22" stroke-width="8"/>
    <circle cx="0" cy="0" r="22" fill="#B8924A" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="serif" font-weight="bold" font-size="18" fill="#1A1A1A">1</text>
  </g>
  <!-- Category label -->
  <text x="200" y="370" text-anchor="middle" font-family="'Fraunces', serif" font-weight="700" font-size="28" fill="#1A1A1A" letter-spacing="-0.5">Sport</text>
</svg>
